body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;line-height:1.75;color:var(--ink);background:#f8fbf8}

.actions{display:grid;gap:12px;margin-top:22px}
.primary{background:var(--green);color:#fff;text-decoration:none;padding:14px 18px;border-radius:11px;font-weight:800;display:block;min-height:50px}

footer{border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.82rem;padding:20px}
